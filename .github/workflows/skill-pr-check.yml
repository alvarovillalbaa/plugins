name: Skill PR check

on:
  pull_request:
    paths:
      - ".github/workflows/skill-pr-check.yml"
      - ".claude-plugin/marketplace.json"
      - "AGENTS.md"
      - "CITATION.cff"
      - "codemeta.json"
      - "catalog.json"
      - "context7.json"
      - "llms.txt"
      - "llms-full.txt"
      - "scripts/**"
      - "schemas/**"
      - "skills-chaining-map.md"
      - "system/**"
      - "marketing/**"
      - "sales/**"
      - "engineering/**"
      - "product/**"
      - "finances/**"
      - "productivity/**"
      - "references/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate skill structure and metadata
        run: |
          python3 scripts/skillctl.py structure check --root .
          python3 scripts/skillctl.py meta check --root . --require-all
          python3 scripts/skillctl.py conflicts check --root .
          python3 scripts/validate_skills.py .

      - name: Run bundled contract tests
        run: python3 scripts/run_skill_tests.py .

      - name: Check generated discovery artifacts
        run: |
          python3 scripts/generate_discovery_catalog.py --check
          python3 scripts/component_graph.py build --check

      - name: Classify changed files
        run: |
          python3 scripts/skillctl.py diff-classify \
            --base "origin/${{ github.base_ref }}" \
            --head HEAD \
            --fail-on-private
